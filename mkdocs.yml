site_name: Q-ETL Documentation
theme: material
nav:
  - Home: index.md
  - Basic Tutorial: basic_tutorial.md
  - API:
    - Inputs: Inputs.md
    - Workers: workers.md
    - Constructors: constructors.md
    - Outputs: outputs.md
    - Integrations: integrations.md
  - Help:
    - FAQ: faq.md
    - Troubleshooting: troubleshooting.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          setup_commands:
            - import sys
            - sys.path.append('python')
          selection:
            docstring_style: numpy